name: Build and deploy Node.js app to Azure Web App - recyclehub-server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build (Backend only)
        # Di chuyển vào thư mục backend trước khi cài đặt
        run: |
          cd backend
          npm install
          npm run build --if-present
          # Chúng ta không chạy npm test ở đây vì file package.json của bạn đang báo lỗi "exit 1"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Chỉ upload nội dung bên trong thư mục backend để server Azure nhẹ nhất có thể
          path: backend/ 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: . # Giải nén nội dung thư mục backend ra thư mục gốc của runner để deploy
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7905C9F952774E44B65E89E4A67F28CE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_63125FFC112145E9B4B904406207C6C2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_49A36127ACE24633AD76B25E3998959D }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'recyclehub-server'
          slot-name: 'Production'
          package: .
